name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 1.24 is the main module's own `go` directive (go.mod); the
          # toolchain must also satisfy tools/golangci-lint/go.mod's `go
          # 1.25.0`, which the lint step below invokes via -modfile.
          go-version: '1.25'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Lint
        run: go tool -modfile=tools/golangci-lint/go.mod golangci-lint run ./...

      - name: Test
        run: go test ./...

      - name: Test (race)
        run: go test -race ./...

      - name: Test (integration)
        # Integration tests — the ones that shell out to the real Go
        # toolchain, compiling/testing throwaway module copies — live behind
        # the "integration" build tag (see internal/mutate/engine_integration*
        # _test.go) rather than a testing.Short() skip, so the two steps
        # above never even compile them in. This step is what actually runs
        # them in CI; -tags=integration also re-includes every fast test
        # (untagged files always compile), so this is a superset, not a
        # narrower run.
        run: go test -tags=integration ./...
        timeout-minutes: 20

      - name: Corpus regression
        # The corpus package's own TestCorpus skips under -short and none of
        # the three steps above pass -short, so this step technically re-runs
        # work those steps already did. It stays as its own step anyway: a
        # distinct, clearly-named
        # step keeps the corpus run's pass/fail and wall-clock time
        # independently visible in the CI UI, separate from the rest of the
        # suite, and easy to re-run or tune (e.g. -run) without touching the
        # general test steps.
        #
        # -timeout is explicit and generous for a reason verified the hard
        # way while building this: `go test` applies its own default 10m
        # process-wide timeout regardless of any context timeout inside the
        # test, and that default panics the whole binary (no per-entry
        # attribution, no clean failure) rather than failing one slow
        # subtest. TestCorpus runs its entries sequentially, not in
        # parallel, specifically so each entry's time is attributable; a
        # single entry (crypto/aes, full-module scope) alone can run
        # hundreds of mutants, each compiling and `go test`-ing its own
        # module copy, so the corpus as a whole needs real headroom. The
        # step's own timeout-minutes sits comfortably above -timeout so a
        # hang shows up as a `go test` timeout with output, not a bare
        # runner cancellation.
        run: go test -run TestCorpus -v -timeout=45m ./internal/corpus/...
        timeout-minutes: 60
