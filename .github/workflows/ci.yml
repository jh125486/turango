name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: tools.sum

      - name: Lint
        run: go tool -modfile=tools.mod golangci-lint run ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: tools.sum

      - name: Check vulnerabilities
        run: go tool -modfile=tools.mod govulncheck ./...

  test:
    runs-on: ubuntu-latest
    # SONAR_TOKEN is exposed at job level, not just the SonarCloud step's own
    # env:, specifically so the SonarCloud Scan step's `if:` guard below can
    # read it as `env.SONAR_TOKEN` — the `secrets` context is not a valid
    # expression context inside a step/job `if:` at all (actionlint and
    # GitHub's own context-availability docs both confirm this; referencing
    # `secrets.SONAR_TOKEN` directly in `if:` fails the whole workflow at
    # parse time, before any job even starts, which is exactly what broke
    # every run of this workflow until this was found and fixed).
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out code
        # Actions below are pinned to full commit SHAs, not tags: a tag can be
        # re-pointed (deliberately, by a re-tag, or maliciously, by a
        # compromised release) to run different code than what was reviewed,
        # while a SHA can't. The trailing `# vN` comment is only for humans —
        # it's what Dependabot's github-actions ecosystem (see
        # .github/dependabot.yml, already configured weekly) reads and
        # rewrites when it bumps a pin to a new SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history, not just the checked-out commit: SonarCloud's
          # scan step below uses it for blame/new-code-period analysis
          # (e.g. "new code since" comparisons), which a shallow clone
          # can't answer.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        # corpus/stdlib-*/module/** are frozen copies of real Go stdlib
        # source, preserved byte-for-byte as historical bug-reproduction
        # fixtures -- their formatting is upstream's, not this project's to
        # fix, and gofmt has always flagged a handful of them (verified
        # locally throughout this repo's development). Excluded the same
        # way every local gofmt check in this project's history has been.
        run: |
          fmt_out="$(gofmt -l . | grep -v '^corpus/stdlib-.*/module/' || true)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Check Go fixes
        run: go fix -diff ./...

      - name: Test
        # -short skips internal/corpus's own TestCorpus (its only consumer
        # of testing.Short() in this whole repo — see corpus.yml for why
        # that lives in its own, differently-triggered workflow instead of
        # every one of these per-PR steps). Nothing else in this codebase
        # checks testing.Short(), so -short here narrows exactly one test,
        # not a broader "skip anything slow" switch. No -coverprofile here
        # deliberately — see the Test (integration) step below for why
        # coverage is collected there instead, not on this faster pass.
        run: go test -short ./...

      - name: Test (race)
        run: go test -short -race ./...

      - name: Test (integration)
        # Integration tests — the ones that shell out to the real Go
        # toolchain, compiling/testing throwaway module copies — live behind
        # the "integration" build tag (see internal/mutate/engine_integration*
        # _test.go) rather than a testing.Short() skip, so the two steps
        # above never even compile them in. This step is what actually runs
        # them in CI; -tags=integration also re-includes every fast test
        # (untagged files always compile), so this is a superset, not a
        # narrower run. -short still applies here for the same reason as
        # above — this step's job is the *other* integration tests, not
        # internal/corpus's own, much slower, TestCorpus.
        #
        # -coverprofile lives on this step, not the plain Test step above,
        # because it's the superset run: measured directly, this repo's
        # real coverage is ~76% under -short alone vs ~85% including the
        # integration-tagged tests — engine.go/runner.go/cache.go all had
        # real, substantial coverage that a -short-only profile simply
        # never saw, which was dragging Codecov's and SonarCloud's reported
        # percentages down by a wide, non-representative margin (confirmed
        # by comparing go tool cover -func output between the two runs
        # directly, not assumed).
        run: go test -short -tags=integration -coverprofile=coverage.out ./...
        timeout-minutes: 20

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage.out
          # Codecov's own current policy is that public open-source repos on
          # codecov.io don't need a token; this is passed anyway (empty
          # until the secret is created) so a private-repo period, or a
          # policy change, doesn't silently stop uploads. fail_ci_if_error
          # keeps a missing/invalid token from failing the whole CI run —
          # CODECOV_TOKEN is an account-linking step done at codecov.io, not
          # something this workflow can set up on its own.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: SonarCloud Scan
        # Guarded on the secret's presence (not just left to fail) so this
        # step is a no-op — not a broken CI run — until a SonarCloud account
        # is linked to this repo and SONAR_TOKEN is created there; see
        # sonar-project.properties. SonarCloud's Go analyzer reads
        # coverage.out directly via sonar.go.coverage.reportPaths (see
        # sonar-project.properties), so this step must run after the Test
        # (integration) step above, not standalone.
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
