name: Scorecard supply-chain security

# The README's OpenSSF Scorecard badge reads from scorecard.dev's public
# API, which only has data for a repo once *this repo's own* Scorecard run
# has published results there — it isn't a general on-demand crawler for
# arbitrary public repos (confirmed the hard way: the badge showed "report
# not found" before this workflow existed). publish_results: true below is
# what actually populates it; everything else here is the standard OSSF
# Scorecard GitHub Action template.
on:
  branch_protection_rule:
  schedule:
    # Weekly, matching this repo's other slow/non-code-change scans
    # (corpus.yml, mutation-badge.yml) rather than running on every push.
    - cron: '30 1 * * 6'
  push:
    branches: [main]

# read-all was broader than needed: the job below already sets its own
# precise permissions (security-events/id-token/contents/actions), which
# always wins over this top-level default anyway — read-all only mattered
# for a hypothetical future job in this file that didn't set its own,
# which doesn't exist. Narrowed to match every other workflow's convention
# in this repo.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Required to publish results and upload to code-scanning.
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif
