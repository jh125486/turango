name: Scorecard supply-chain security

# The README's OpenSSF Scorecard badge reads from scorecard.dev's public
# API, which only has data for a repo once *this repo's own* Scorecard run
# has published results there — it isn't a general on-demand crawler for
# arbitrary public repos (confirmed the hard way: the badge showed "report
# not found" before this workflow existed). publish_results: true below is
# what actually populates it; everything else here is the standard OSSF
# Scorecard GitHub Action template.
on:
  branch_protection_rule:
  schedule:
    # Weekly, matching this repo's other slow/non-code-change scans
    # (corpus.yml, mutation-badge.yml) rather than running on every push.
    - cron: '30 1 * * 6'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Required to publish results and upload to code-scanning.
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: results.sarif
