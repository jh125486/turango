name: Corpus regression

# Deliberately NOT triggered by push/pull_request, unlike ci.yml. The corpus
# (internal/corpus's TestCorpus, corpus/*/golden*.json) exists to measure
# the real historical bugs and testing gaps turango is designed to catch,
# not to gate every PR — running it on every push would make ordinary CI as
# slow as its single slowest fixture. As of this writing that fixture is
# stdlib-crypto-aes: 7746 mutants, over an hour by itself even at
# -mutateparallel=GOMAXPROCS, next to every other entry combined taking a
# few minutes. schedule + workflow_dispatch keeps this real and automated
# (so a genuine regression in mutant generation still gets caught, not
# nothing) without being on the critical path of every contributor's PR.
on:
  schedule:
    # Once a week is enough to catch a regression without burning CI
    # minutes on a mostly-static frozen corpus daily; -run/workflow_dispatch
    # below covers "I want this sooner" on demand.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  corpus:
    name: Corpus regression (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep each slow stdlib sweep on its own runner. The remaining
          # fixtures share one shard, including fixtures added later.
          - name: stdlib-crypto-aes
            memory_limit: ''
            test_filter: '^TestCorpus$/^stdlib-crypto-aes$/'
            skip_filter: ''
          - name: stdlib-encoding-base64
            # A runaway mutant grows its test process past the hosted runner's
            # memory limit. Keep it bounded so its existing 30s timeout wins.
            memory_limit: 512MiB
            test_filter: '^TestCorpus$/^stdlib-encoding-base64$/'
            skip_filter: ''
          - name: remaining
            memory_limit: ''
            test_filter: '^TestCorpus$/'
            skip_filter: '^TestCorpus$/^(stdlib-crypto-aes|stdlib-encoding-base64)$/'
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Corpus regression
        # -timeout and timeout-minutes are both real, observed numbers, not
        # guesses — corpus_test.go's own corpusRunTimeout constant sets the
        # equivalent per-entry safety net for local/manual runs; keep the
        # two in sync if either changes. Each matrix shard filters TestCorpus
        # to its assigned entries; TestCorpus still runs those entries
        # sequentially within the shard.
        run: |
          if [[ -n '${{ matrix.memory_limit }}' ]]; then
            export GOMEMLIMIT='${{ matrix.memory_limit }}'
          fi

          if [[ -n '${{ matrix.skip_filter }}' ]]; then
            go test -run '${{ matrix.test_filter }}' -skip '${{ matrix.skip_filter }}' -v -timeout=3h ./internal/corpus/...
          else
            go test -run '${{ matrix.test_filter }}' -v -timeout=3h ./internal/corpus/...
          fi
        timeout-minutes: 210
