name: Mutation score badge

# Dogfooding: turango mutates its own core packages the same way
# TestRunAgainstRealModule (internal/mutate/engine_integration_test.go)
# exercises a fixture module end to end, except here it runs for real
# against turango's own source and publishes the resulting score as a
# shields.io badge.
#
# A full sweep is expensive — see ci.yml's "Corpus regression" step comment
# for the scale one mutant's own `go test` cycle can hit — so this runs on a
# schedule/manual dispatch, never per-push or per-PR, mirroring how
# ci.yml's own slow steps (integration, corpus) stay inside CI rather than
# spawning a second always-on workflow.
on:
  schedule:
    # Weekly. The mutation score changes only when source or tests change,
    # not on a fixed cadence, but a calendar trigger is the simplest way to
    # keep the published badge from silently going stale if nobody happens
    # to run this manually for a while.
    - cron: '0 6 * * 1' # 06:00 UTC every Monday
  workflow_dispatch: {}

permissions:
  contents: write # required to push the generated badge JSON to gh-pages

jobs:
  mutation-score:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build turango
        run: go build -o ./turango-bin ./cmd/turango

      # Verdicts are cached across scheduled runs (gap 12's -mutatecache,
      # see README's "Resuming after interruption" section): keyed on the
      # hash of every source/test file the run below actually covers, so an
      # unrelated doc-only change still gets a full cache hit next Monday,
      # and a real source edit invalidates only the mutants it affects, not
      # the whole run.
      - name: Restore mutation verdict cache
        uses: actions/cache@v6
        with:
          path: mutation-cache
          key: mutation-cache-${{ hashFiles('cmd/turango/**.go', 'internal/mutate/**.go', 'internal/mutator/**.go') }}
          restore-keys: |
            mutation-cache-

      - name: Run turango against its own module
        # Scope deliberately excludes internal/corpus and internal/goproxy:
        # corpus's own tests (TestCorpus) alone can run 45+ minutes (see
        # ci.yml), and re-running that per mutant under -mutatescope=full
        # would make this job's cost unbounded. cmd/turango,
        # internal/mutate and internal/mutator are turango's actual
        # mutation-testing logic — the meaningful thing to dogfood — and
        # -mutatescope=package reruns only each mutated file's own package
        # tests rather than the whole module per mutant, keeping this
        # tractable on a weekly schedule.
        run: |
          mkdir -p mutation-report mutation-cache
          ./turango-bin test -mutate=. \
            -mutatescope=package \
            -mutateoutput=mutation-report \
            -mutatecache=mutation-cache \
            ./cmd/turango/... ./internal/mutate/... ./internal/mutator/...

      - name: Compute mutation score
        id: score
        run: |
          report=mutation-report/mutate-report.json
          killed=$(jq '[.Mutants[] | select(.Status=="killed")] | length' "$report")
          survived=$(jq '[.Mutants[] | select(.Status=="survived")] | length' "$report")
          viable=$((killed + survived))

          if [ "$viable" -eq 0 ]; then
            pct="0.0"
          else
            pct=$(awk -v k="$killed" -v v="$viable" 'BEGIN { printf "%.1f", (k / v) * 100 }')
          fi

          # shields.io endpoint-schema color thresholds: red below 50%,
          # yellow from 50% up to (not including) 80%, green at 80%+ — the
          # same three-tier split turango's own README uses informally when
          # describing a "good" score; adjust if the project settles on a
          # different bar.
          color=$(awk -v p="$pct" 'BEGIN {
            if (p + 0 >= 80) print "brightgreen";
            else if (p + 0 >= 50) print "yellow";
            else print "red";
          }')

          echo "killed=$killed" >> "$GITHUB_OUTPUT"
          echo "survived=$survived" >> "$GITHUB_OUTPUT"
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          echo "color=$color" >> "$GITHUB_OUTPUT"

      - name: Write shields.io endpoint JSON
        run: |
          mkdir -p badges
          cat > badges/mutation-score.json <<EOF
          {
            "schemaVersion": 1,
            "label": "mutation score",
            "message": "${{ steps.score.outputs.pct }}%",
            "color": "${{ steps.score.outputs.color }}"
          }
          EOF

      - name: Publish to gh-pages
        # peaceiris/actions-gh-pages both creates the gh-pages branch (as an
        # orphan commit, no shared history with main) on its first run if it
        # doesn't exist yet, and updates it in place on every run after —
        # no manual `git worktree`/orphan-branch setup needed here.
        # keep_files: true so this workflow only ever touches its own
        # badges/ directory and never wipes out anything else later added
        # to gh-pages.
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badges
          keep_files: true
          commit_message: >-
            mutation score: ${{ steps.score.outputs.pct }}%
            (${{ steps.score.outputs.killed }} killed /
            ${{ steps.score.outputs.survived }} survived)
