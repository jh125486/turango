name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # A periodic scan catches new advisories against code that hasn't
    # changed, not just new code — matching GitHub's own default template
    # for this workflow.
    - cron: '30 4 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['go']

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Matches ci.yml's pin so CodeQL builds this module the same way
          # CI does.
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: ${{ matrix.language }}
          # corpus/**/module/** are frozen copies of real Go stdlib source,
          # preserved byte-for-byte as historical bug-reproduction fixtures —
          # not this project's code, and their upstream test helpers trip
          # go/insecure-randomness (math/rand used deliberately for
          # randomized fuzz-style test inputs, not a security-sensitive use)
          # for no findings this project can act on. Excluded the same way
          # gofmt/golangci-lint/SonarCloud already exclude these fixtures
          # elsewhere.
          paths-ignore: |
            corpus/**

      # Go is a compiled language CodeQL's autobuild step handles natively
      # (it shells out to `go build ./...`), so no manual build step is
      # needed here — see github/codeql-action's own docs for this exact
      # matrix shape.
      - name: Autobuild
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: '/language:${{ matrix.language }}'
