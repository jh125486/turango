name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # A periodic scan catches new advisories against code that hasn't
    # changed, not just new code — matching GitHub's own default template
    # for this workflow.
    - cron: '30 4 * * 1'

permissions:
  # actions:read and security-events:write live at job level below, which
  # always wins over this top-level default anyway — narrowed here to match
  # every other workflow's convention in this repo (see scorecard.yml's
  # identical fix), since OpenSSF Scorecard's Token-Permissions check flags
  # any write scope set at the top level, whether or not a job actually
  # uses it.
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['go']

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Matches ci.yml's pin so CodeQL builds this module the same way
          # CI does.
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: ${{ matrix.language }}
          # build-mode: manual, not autobuild — autobuild discovers and
          # traces every go.mod it finds anywhere in the checkout, which
          # includes each corpus/*/module fixture's own separate module
          # (confirmed directly: the previous attempt's autobuild log
          # listed all 20 go.mod files in the tree and traced each one,
          # so corpus/**'s go/insecure-randomness findings kept reappearing
          # even with config-file's paths-ignore correctly loaded — the
          # exclusion filters *reported results*, not what autobuild
          # chooses to build). Manual mode runs exactly the build command
          # below, scoped to the root module only, matching what real CI
          # actually builds.
          build-mode: manual
          # paths-ignore is not a valid direct input on this action (passing
          # it here is silently ignored, not an error — confirmed the hard
          # way). Path filters only work via an external config file. See
          # .github/codeql/codeql-config.yml for why corpus/** is excluded
          # from reported results too, as a second layer alongside
          # build-mode: manual actually keeping it unbuilt.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: '/language:${{ matrix.language }}'
