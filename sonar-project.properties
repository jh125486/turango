# SonarCloud configuration for jh125486/turango.
#
# sonar.projectKey follows SonarCloud's default auto-generated format for a
# GitHub-imported project: "<organization-key>_<repo-name>". Double-check
# this against the project's actual key on sonarcloud.io once it's created
# there — SonarCloud lets you override the generated key at import time, so
# this is an assumption, not a guarantee.
sonar.projectKey=jh125486_turango
sonar.organization=jh125486

# Go coverage: matches ci.yml's "Test" step, which now writes
# coverage.out via `go test -coverprofile=coverage.out ./...`. SonarCloud's
# Go analyzer reads the standard `go test` cover-profile format directly, no
# conversion step needed.
sonar.go.coverage.reportPaths=coverage.out

# corpus/**/module and example/legacy are throwaway fixture Go modules used
# as regression-test inputs (golden-file driven mutation-testing corpus
# entries), not turango's own source — excluded the same way vendored or
# generated code would be, so they don't skew turango's own quality gate.
sonar.exclusions=corpus/**,example/**

# Issue suppressions, recorded here (not just accepted in the SonarCloud UI)
# so the reasoning survives review and isn't tribal knowledge. Note the
# verification caveat: these properties only take effect on the *next* CI
# Sonar analysis run — there's no way to confirm locally that SonarCloud
# honours Analysis Scope settings sourced from this file. If it turns out it
# doesn't, the fallback is marking the corresponding issues Accepted directly
# in the SonarCloud UI, with this block remaining the in-repo record of why.
sonar.issue.ignore.multicriteria=testComplexity,testParams,gitPath

# go:S3776 (cognitive complexity) on test files. This extends to SonarCloud a
# policy .golangci.yml already applies to gocyclo, with the same reasoning:
# table-driven tests with many t.Run/switch-case assertions rack up
# "complexity" that isn't a signal about the test's quality, unlike the same
# metric on production control flow. The worst offenders here make the point
# — TestResolverResolve (passthrough_internal_test.go) and TestMutate
# (statement/remover_test.go) both score 50+ purely because their table rows
# carry func fields, so every branch inside every case's closure is counted as
# nested inside the parent test function. Splitting those tables into extracted
# helpers would separate each case's setup from its assertions and make them
# harder to read, not easier. Production complexity is deliberately NOT ignored
# anywhere: every S3776 hit in engine.go, runner.go, impact.go, constswap.go and
# cmd/turango was fixed rather than suppressed.
sonar.issue.ignore.multicriteria.testComplexity.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.testComplexity.resourceKey=**/*_test.go

# go:S107 (parameter count) on test files. One hit: benchMutateOnce in
# mutate_bench_test.go, a benchmark helper taking the nine axes of one
# target x scope x TCE x parallelism measurement from its single call site.
# Bundling them into a struct would add a type that exists only to satisfy a
# count, at the one place the explicit ordering is already documented by the
# helper's own doc comment. engine.go's four S107 hits were fixed, not
# suppressed — those were the same values threaded verbatim down a call chain,
# which is a real bundle; this is not.
sonar.issue.ignore.multicriteria.testParams.ruleKey=go:S107
sonar.issue.ignore.multicriteria.testParams.resourceKey=**/*_test.go

# go:S4036 (OS command resolved through PATH) in internal/mutate/runner.go.
# The five hits are the bare "git" in copyWorktree/gitRepoRoot/gitPrefix/
# gitWorktreeClean. turango already locates and executes the *go* toolchain by
# scanning PATH (goproxy.Resolve's documented step 2), and then runs `go test`
# on a mutated module copy as its entire reason for existing: anyone who can
# write to a directory on the invoking developer's PATH already controls a far
# more powerful binary than git. Pinning git to an absolute path while go comes
# off the same PATH would harden nothing. The narrower sub-case this rule
# really targets — picking up a binary from the working directory via an empty
# PATH entry — is already closed twice over: os/exec has refused relative
# resolution (ErrDot) since Go 1.19, and goproxy's own resolver explicitly
# skips empty PATH entries for exactly this reason. Scoped to runner.go rather
# than a project-wide rule so a genuinely externally-influenced exec elsewhere
# would still be flagged.
sonar.issue.ignore.multicriteria.gitPath.ruleKey=go:S4036
sonar.issue.ignore.multicriteria.gitPath.resourceKey=internal/mutate/runner.go
